[versions]
android = "8.7.3"
dokka = "2.2.0"
ftc = "12.0.0"
kotlin = "2.3.0"
kotest = "5.9.1"
sloth = "0.3.2"
ejml = "0.41"
ivy = "1.1.1"
ktor = "3.6.1"
kotlinx-serialization = "1.12.0"
msgpack = "0.9.12"

[libraries]
dokka-mathjax-plugin = { module = "org.jetbrains.dokka:mathjax-plugin" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertations = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-data-driven = { module = "io.kotest:kotest-framework-datatest", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version = "1.14.2" }
functional-interfaces = { module = "dev.nextftc:functional-interfaces", version = "1.0.1" }
ejml = { module = "org.ejml:ejml-simple", version.ref = "ejml" }
ftc-robot-core = { group = "org.firstinspires.ftc", name = "RobotCore", version.ref = "ftc" }
ftc-hardware = { group = "org.firstinspires.ftc", name = "Hardware", version.ref = "ftc" }
ftc-common = { group = "org.firstinspires.ftc", name = "FtcCommon", version.ref = "ftc" }
sloth = { module = "dev.frozenmilk.sinister:Sloth", version.ref = "sloth" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
ivy = { module = "com.pedropathing.ivy:core", version.ref = "ivy" }
blaze = { module = "dev.anygeneric:blazeftc", version = "0.1.66"}
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
msgpack-core = { module = "org.msgpack:msgpack-core", version.ref = "msgpack" }

[bundles]
kotest = ["kotest-runner", "kotest-assertations", "kotest-property", "kotest-data-driven"]
ftc = ["ftc-robot-core", "ftc-hardware", "ftc-common"]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "android" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }