name: Deploy API Docs

# Layout of the `gh-pages` branch:
#   /             index page linking to the folders below
#   /release/     docs for the latest release
#   /snapshot/    docs for the current main branch
#   /<version>/   docs for each released version (e.g. /0.3.0/)
on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      kind:
        description: 'What to deploy'
        required: true
        type: choice
        options:
          - snapshot
          - release
      version:
        description: 'Release version (without the leading v); only used when kind is release'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: "docs"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine what to deploy
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          KIND=snapshot
          TAG=""
          if [ "$EVENT" = "release" ]; then
            KIND=release
            TAG="$RELEASE_TAG"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_KIND" = "release" ]; then
            KIND=release
            if [ -z "$INPUT_VERSION" ]; then
              echo "::error::A version is required when deploying a release."
              exit 1
            fi
            TAG="v${INPUT_VERSION#v}"
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Checkout gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate docs
        env:
          KIND: ${{ steps.target.outputs.kind }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          REF=main
          if [ "$KIND" = "release" ]; then REF="$TAG"; fi
          ./gradlew dokkaGenerate -Pdocs.sourceRef="$REF"

      - name: Update site
        env:
          KIND: ${{ steps.target.outputs.kind }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          OUT=build/dokka/html
          if [ "$KIND" = "snapshot" ]; then
            mkdir -p site/snapshot
            rsync -a --delete "$OUT"/ site/snapshot/
          else
            mkdir -p "site/$VERSION" site/release
            rsync -a --delete "$OUT"/ "site/$VERSION"/
            rsync -a --delete "$OUT"/ site/release/
            echo "$VERSION" > site/release/.version
          fi

          # Redirect the root to the latest release (or the snapshot if no release exists yet).
          DEST=release/
          [ -d site/release ] || DEST=snapshot/
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>NextFTC API Docs</title>
            <link rel="canonical" href="$DEST">
            <meta http-equiv="refresh" content="0; url=$DEST">
          </head>
          <body><a href="$DEST">NextFTC API Docs</a></body>
          </html>
          EOF
          touch site/.nojekyll

      - name: Commit and push
        working-directory: site
        env:
          KIND: ${{ steps.target.outputs.kind }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to deploy."
            exit 0
          fi
          git commit -m "Deploy $KIND docs ${VERSION:+($VERSION) }from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
